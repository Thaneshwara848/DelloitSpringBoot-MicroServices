spring.application.name=SpringBootDemo03
server.port=9999

spring.datasource.url=jdbc:mysql://localhost:3306/Delliot
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# Expose selected Actuator endpoints
management.endpoints.web.exposure.include=health,info,metrics,beans,mappings,loggers

# Show health details
management.endpoint.health.show-details=always

# Application information
management.info.env.enabled=true
info.app.name=Employee Management System
info.app.version=1.0
info.app.description=Spring Boot CRUD Application